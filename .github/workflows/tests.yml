name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python pytest-homeassistant-custom-component ruff
      - name: Lint
        run: |
          .venv/bin/ruff check custom_components tests tools
          .venv/bin/ruff format --check custom_components tests tools
      - name: Test
        # The live test skips itself when no .envrc with credentials exists.
        run: .venv/bin/python -m pytest -q
