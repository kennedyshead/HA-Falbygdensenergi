[project]
name = "ha-falbygdensenergi"
version = "0.1.0"
description = "Home Assistant integration for Falbygdens Energi 'Mina sidor'"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
